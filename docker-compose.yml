services:
  postgres:
    image: postgres:17
    container_name: candle-intelligence-postgres
    environment:
      POSTGRES_USER: candle
      POSTGRES_PASSWORD: candle
      POSTGRES_DB: candle_intelligence
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candle -d candle_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
